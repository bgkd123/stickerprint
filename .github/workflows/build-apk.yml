name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Fix Android SDK Download (403 Error Bypass)
        run: |
          # Replaces old Google URLs causing 403 Forbidden error
          find ~/.local/lib/python*/site-packages/buildozer -type f -exec sed -i 's|http://dl-ssl.google.com|https://dl.google.com|g' {} \;
          find ~/.local/lib/python*/site-packages/buildozer -type f -exec sed -i 's|https://dl-ssl.google.com|https://dl.google.com|g' {} \;

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_ACCEPT_LICENSE=1
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stickerprint-apk
          path: bin/*.apk
