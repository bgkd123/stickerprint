name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip3 install --user --upgrade buildozer cython virtualenv

      - name: Build with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          # Force the system to use the latest SDK/NDK links
          sed -i 's|http://dl-ssl.google.com|https://dl.google.com|g' ~/.local/lib/python3.10/site-packages/buildozer/targets/android.py
          sed -i 's|https://dl-ssl.google.com|https://dl.google.com|g' ~/.local/lib/python3.10/site-packages/buildozer/targets/android.py
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stickerprint-apk
          path: bin/*.apk
